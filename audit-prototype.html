<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#236cf2" />
<title>AI 知識代理人管理後臺 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1769ff; --blue-d:#0f5fed; --blue-soft:#f1f6ff; --blue-line:#d8e2f3;
  --ink:#17233c; --muted:#68758d; --muted-2:#8a96aa;
  --surface:#fff; --surface-2:#f7faff;
  --line:#dfe7f4; --line-soft:#ecf1f9;
  --amber:#b8791b; --amber-soft:#fdf3e0;
  --red:#d1453b; --red-soft:#fdeceb; --crit:#96201a;
  --green:#1f8a5f; --green-soft:#e6f5ee;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Noto Sans TC","Helvetica Neue",Arial,sans-serif;
  --r:18px; --r2:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); font-size:14px; line-height:1.65;
  background:radial-gradient(circle at top left,rgba(35,108,255,.14),transparent 34rem),
             linear-gradient(135deg,#f7faff,#edf4ff 42%,#f8fbff);
  background-attachment:fixed; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:rgba(255,255,255,.94);border-right:1px solid var(--blue-line);
  box-shadow:12px 0 34px rgba(32,73,132,.06);backdrop-filter:blur(16px);display:flex;flex-direction:column}
.brand{padding:20px 16px 16px}
.brand .mark{display:flex;gap:11px;align-items:center}
.brand .mark span{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,#1769ff,#42a5ff);color:#fff;font-weight:900;font-size:15px;box-shadow:0 10px 20px rgba(23,105,255,.28)}
.brand h1{margin:0;font-size:15px;font-weight:900;letter-spacing:-.01em}
.brand p{margin:1px 0 0;font-size:11px;color:var(--muted-2);font-family:var(--mono)}
.nav{padding:8px 10px;flex:1;overflow-y:auto}
.nav-group{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted-2);padding:12px 8px 6px;text-transform:uppercase}
.nav button{display:flex;width:100%;gap:10px;align-items:baseline;background:none;border:1px solid transparent;
  color:#263b5c;padding:9px 11px;text-align:left;border-radius:var(--r2);font-size:13.5px;margin-bottom:3px}
.nav button .n{font-family:var(--mono);font-size:10px;color:var(--muted-2)}
.nav button:hover{background:#f6f9ff}
.nav button.on{background:var(--blue-soft);color:var(--blue-d);border-color:rgba(15,95,237,.18);font-weight:700}
.nav button.on .n{color:var(--blue-d)}
.side-foot{padding:14px 18px 18px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:10.5px;color:var(--muted-2);line-height:1.8}
.side-foot b{color:var(--muted);font-weight:500}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:rgba(255,255,255,.92);border-bottom:1px solid var(--blue-line);padding:11px 24px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;backdrop-filter:blur(12px)}
.env{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.env .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.env .sep{color:var(--blue-line)}
.spacer{flex:1}
.persp-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted-2);text-transform:uppercase}
.persp{display:flex;border:1px solid var(--blue-line);border-radius:999px;overflow:hidden;background:var(--surface)}
.persp button{background:none;border:0;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.persp button .k{font-family:var(--mono);font-size:10px}
.persp button.on{background:var(--blue);color:#fff}
.persp button.on .k{color:rgba(255,255,255,.75)}

.wrap{padding:28px 32px 72px;max-width:1440px;width:100%;margin:0 auto}
.page-head{margin-bottom:18px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--blue);text-transform:uppercase;font-weight:600}
.page-head h2{margin:5px 0 4px;font-size:28px;font-weight:900;letter-spacing:-.03em}
.page-head p{margin:0;color:var(--muted);max-width:80ch}

.card{background:rgba(255,255,255,.96);border:1px solid rgba(184,204,235,.72);border-radius:var(--r);box-shadow:0 14px 38px rgba(42,78,130,.07),0 2px 8px rgba(42,78,130,.035);overflow:hidden}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-b{padding:16px}

.sev{display:inline-flex;align-items:flex-end;gap:1.5px;height:13px}
.sev i{width:3px;background:var(--line);border-radius:.5px;display:block}
.sev i:nth-child(1){height:4px}.sev i:nth-child(2){height:7px}
.sev i:nth-child(3){height:10px}.sev i:nth-child(4){height:13px}
.sev[data-s="INFO"] i:nth-child(-n+1){background:var(--muted-2)}
.sev[data-s="WARNING"] i:nth-child(-n+2){background:var(--amber)}
.sev[data-s="ERROR"] i:nth-child(-n+3){background:var(--red)}
.sev[data-s="CRITICAL"] i{background:var(--crit)}
.sev-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:600}
.sev-tag[data-s="INFO"]{color:var(--muted)}
.sev-tag[data-s="WARNING"]{color:var(--amber)}
.sev-tag[data-s="ERROR"]{color:var(--red)}
.sev-tag[data-s="CRITICAL"]{color:var(--crit)}

.code{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--blue-line);white-space:nowrap;display:inline-block}
.code.err{background:var(--red-soft);border-color:#f3ccc9;color:#a5322a}
.code.ok{background:var(--green-soft);border-color:#c9e6d8;color:var(--green)}
.pill{display:inline-block;font-size:11.5px;padding:1px 10px;border-radius:999px;border:1px solid var(--blue-line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green-soft);border-color:#c9e6d8;color:var(--green)}
.pill.warn{background:var(--amber-soft);border-color:#eddcbc;color:var(--amber)}
.pill.bad{background:var(--red-soft);border-color:#f3ccc9;color:#a5322a}
.pill.blue{background:var(--blue-soft);border-color:#cfe0fb;color:var(--blue-d)}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.f label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.f select,.f input{width:100%;padding:8px 10px;border:1px solid var(--blue-line);border-radius:var(--r2);background:var(--surface);font-size:13px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--blue-line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff}
.chip.on .sev i{background:rgba(255,255,255,.4)}
.chip.on .sev[data-s="INFO"] i:nth-child(-n+1),.chip.on .sev[data-s="WARNING"] i:nth-child(-n+2),
.chip.on .sev[data-s="ERROR"] i:nth-child(-n+3),.chip.on .sev[data-s="CRITICAL"] i{background:#fff}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;padding:8px 16px;border-radius:var(--r2);font-size:13px;font-weight:700}
.btn.ghost{background:var(--surface);color:var(--blue-d)}
.btn.small{padding:4px 11px;font-size:12px;border-radius:999px}

.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
  text-transform:uppercase;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tbody tr[data-id]{cursor:pointer}
.tbl tbody tr[data-id]:hover{background:#fafcff}
.tbl tbody tr.sel{background:var(--blue-soft)}
.tbl td .m{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tbl td .t{font-weight:700}
.tbl .num{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.tags{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.detail{margin-top:16px;border:1px solid var(--blue);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:0 10px 28px rgba(23,105,255,.12)}
.detail-h{background:linear-gradient(135deg,#1769ff,#3d8bff);color:#fff;padding:13px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.detail-h h3{margin:0;font-size:15px;font-weight:700}
.detail-h .m{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.8)}
.detail-h .act{font-family:var(--mono);font-size:11.5px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:999px}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.track{padding:18px 20px;min-width:0}
.track.it{background:var(--surface-2);border-left:1px solid var(--line)}
.track-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.track-h .who{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.track-h strong{font-size:13.5px}
.say{font-size:15px;line-height:1.75;margin:0 0 14px;font-weight:500}
.doblock{background:var(--blue-soft);border:1px solid #dbe7fb;border-radius:var(--r2);padding:12px 14px;margin-bottom:14px}
.doblock .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--blue-d);text-transform:uppercase;margin-bottom:5px}
.doblock p{margin:0;font-size:13.5px}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.kv dt{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}
.kv dd{margin:0;word-break:break-word}
.payload{background:#0f1b30;color:#d6dcea;font-family:var(--mono);font-size:11.5px;line-height:1.65;padding:14px;border-radius:var(--r2);overflow-x:auto;margin:0;max-height:400px}
.payload .k{color:#8fb3d9}.payload .s{color:#d0a98a}.payload .n{color:#9fc79b}.payload .z{color:#7c838f}
.payload mark{background:rgba(255,120,100,.35);color:#fff;padding:0 2px;border-radius:2px}
.detail-f{padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.stat{border:1px solid var(--blue-line);border-radius:var(--r);background:var(--surface);padding:15px 17px;box-shadow:0 8px 22px rgba(32,73,132,.05)}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.stat .v{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--muted);margin-top:2px}
.stat.alert{border-color:#f3ccc9;background:linear-gradient(180deg,#fffafa,#fff)}
.stat.cost{border-color:#cfe0fb;background:linear-gradient(180deg,#f7faff,#fff)}
.bar{height:7px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar i.warn{background:var(--amber)}
.bar i.red{background:var(--red)}
.note{border:1px solid var(--blue-line);border-left:3px solid var(--blue);background:var(--surface);padding:12px 15px;border-radius:0 var(--r2) var(--r2) 0;font-size:13px}
.note.amber{border-left-color:var(--amber)}
.note b{display:block;margin-bottom:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.hint{font-size:11.5px;color:var(--muted-2);font-family:var(--mono)}
.rowline{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(90px,2fr) 92px 108px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r2);font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.2);z-index:99;max-width:420px}

@media(max-width:1040px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--blue-line)}
  .brand{padding:12px 14px;white-space:nowrap}
  .brand p{display:none}
  .nav{display:flex;gap:6px;padding:8px}
  .nav-group{display:none}
  .nav button{white-space:nowrap;margin:0}
  .side-foot{display:none}
  .wrap{padding:18px 14px 50px}
  .rowline{grid-template-columns:1fr 1fr;gap:6px}
}

/* Refined visual layer — preserves the original blue/white product palette. */
body{
  background:
    radial-gradient(circle at 12% -8%,rgba(23,105,255,.17),transparent 34rem),
    radial-gradient(circle at 92% 8%,rgba(66,165,255,.09),transparent 28rem),
    linear-gradient(145deg,#f8fbff 0%,#eef5ff 50%,#f8fbff 100%);
}
.side{
  background:rgba(255,255,255,.96);
  border-right-color:rgba(184,204,235,.72);
  box-shadow:16px 0 46px rgba(31,72,132,.07);
}
.brand{padding:24px 18px 19px}
.brand .mark{gap:13px}
.brand .mark span{
  width:44px;height:44px;border-radius:15px;
  box-shadow:0 12px 26px rgba(23,105,255,.26),inset 0 1px 0 rgba(255,255,255,.34)
}
.brand h1{font-size:15.5px;line-height:1.45}
.nav{padding:10px 12px}
.nav button{
  min-height:42px;padding:10px 12px;border-radius:12px;
  transition:background-color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease
}
.nav button:hover{background:#f3f7ff;transform:translateX(2px)}
.nav button.on{
  background:linear-gradient(135deg,#edf4ff,#f5f8ff);
  box-shadow:inset 3px 0 0 var(--blue),0 6px 16px rgba(23,105,255,.06)
}
.topbar{
  position:sticky;top:0;z-index:20;min-height:60px;padding:12px 32px;
  background:rgba(255,255,255,.88);border-bottom-color:rgba(184,204,235,.65);
  box-shadow:0 8px 26px rgba(42,78,130,.045)
}
.persp{padding:3px;background:#f5f8fd;box-shadow:inset 0 1px 2px rgba(31,72,132,.05)}
.persp button{padding:7px 15px;border-radius:999px;transition:all .18s ease}
.persp button.on{background:linear-gradient(135deg,var(--blue),#3b8cff);box-shadow:0 6px 14px rgba(23,105,255,.22)}
.page-head{margin-bottom:22px;padding:2px 2px 0}
.page-head h2{margin:6px 0 6px;font-size:31px;line-height:1.25}
.page-head p{font-size:14px;line-height:1.8;color:#60708a}
.eyebrow{font-size:10px;letter-spacing:.24em}
.card-h{min-height:52px;padding:15px 18px;background:linear-gradient(180deg,rgba(248,251,255,.9),rgba(255,255,255,.65))}
.card-h h3{font-size:15px}
.card-b{padding:19px}
.chiprow{gap:8px!important}
.chip{
  min-height:34px;padding:6px 13px;background:#fbfdff;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background-color .16s ease
}
.chip:hover{transform:translateY(-1px);border-color:#aac5f1;box-shadow:0 6px 13px rgba(42,78,130,.07)}
.chip.on{background:linear-gradient(135deg,var(--blue),#3a8bff);box-shadow:0 7px 16px rgba(23,105,255,.2)}
.filters{gap:14px}
.f label{margin:0 0 7px 2px;color:#72809a}
.f select,.f input{
  min-height:42px;padding:9px 12px;border-color:#d5e1f2;background:#fbfdff;
  box-shadow:0 1px 2px rgba(31,72,132,.025);
  transition:border-color .16s ease,box-shadow .16s ease,background-color .16s ease
}
.f select:hover,.f input:hover{border-color:#aec7ed;background:#fff}
.f select:focus,.f input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,255,.11);outline:none;background:#fff}
.btn{min-height:42px;border-radius:12px;box-shadow:0 7px 16px rgba(23,105,255,.18);transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(23,105,255,.23)}
.btn.ghost{background:#fff;box-shadow:0 4px 12px rgba(42,78,130,.06)}
.btn.small{min-height:30px;padding:4px 12px}
.scroll{scrollbar-color:#bfd0e8 transparent;scrollbar-width:thin}
.tbl thead th{padding:12px 15px;background:#f5f8fd;color:#6d7c94;border-bottom-color:#dce6f4}
.tbl tbody td{padding:14px 15px}
.tbl tbody tr[data-id]{transition:background-color .15s ease,box-shadow .15s ease}
.tbl tbody tr[data-id]:hover{background:#f7faff;box-shadow:inset 3px 0 0 rgba(23,105,255,.45)}
.tbl tbody tr.sel{background:#eef5ff;box-shadow:inset 3px 0 0 var(--blue)}
.pill{padding:2px 10px}
.detail{margin-top:20px;border-color:#abc8f4;box-shadow:0 18px 42px rgba(23,105,255,.13)}
.detail-h{padding:15px 20px;background:linear-gradient(125deg,#1263f4,#438fff)}
.track{padding:22px}
.stat{padding:18px 19px;border-color:rgba(184,204,235,.72);box-shadow:0 12px 30px rgba(42,78,130,.065)}
.stat .v{font-size:32px;margin-top:7px}
.toast{right:26px;bottom:26px;border-radius:14px;box-shadow:0 16px 36px rgba(13,27,52,.25)}
@media(max-width:1040px){
  .topbar{padding:10px 16px;position:static}
  .wrap{padding:22px 16px 54px}
  .page-head h2{font-size:27px}
}

/* Accessibility baseline: no visible interface text below 16px. */
body{font-size:16px}
.brand .mark span,.brand h1,.brand p,.nav-group,.nav button,.nav button .n,.side-foot,
.env,.persp-label,.persp button,.persp button .k,.eyebrow,.page-head p,.card-h h3,.card-h .sub,
.sev-tag,.code,.pill,.f label,.f select,.f input,.chip,.btn,.btn.small,.tbl thead th,.tbl td .m,
.tbl .num,.detail-h h3,.detail-h .m,.detail-h .act,.track-h .who,.track-h strong,.say,
.doblock .k,.doblock p,.kv,.kv dt,.payload,.detail-f,.stat .k,.stat .d,.note,.legend,.hint,.toast{
  font-size:16px!important
}
.nav button.on{box-shadow:0 6px 16px rgba(23,105,255,.06)}
.tbl tbody tr[data-id]{cursor:default}
.note-editor{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:8px;align-items:center}
.note-editor input{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--blue-line);border-radius:10px;background:#f7f9fc}
.note-editor input:not([readonly]){background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,255,.1)}
.note-display{min-height:42px;display:flex;align-items:center;line-height:1.55;color:var(--ink)}
.note-display.empty{color:var(--muted)}
.sort-btn{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:800;padding:0;cursor:pointer;white-space:nowrap}
.sort-btn:hover,.sort-btn.active{color:var(--blue)}
.sort-btn small{font-size:16px;font-weight:700;margin-left:6px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">

   '<div class="filters">'+
    '<div class="f"><label>統計區間</label><div class="chiprow">'+
      ['day','week','month'].map(function(k){return '<button class="chip '+(state.period===k?'on':'')+'" data-period="'+k+'">'+STATS[k].label+'</button>'}).join('')+
    '</div></div>'+
    '<div class="f"><label>起始日期</label><input type="date" id="dfrom" value="'+state.from+'"></div>'+
    '<div class="f"><label>結束日期</label><input type="date" id="dto" value="'+state.to+'"></div>'+
    '<div class="f"><label>&nbsp;</label><button class="btn ghost" id="statexport">匯出報表</button></div>'+
   '</div>'+
   '<div class="hint" style="margin-top:10px">目前顯示：'+state.from+' 至 '+state.to+'（以'+d.label+'為單位）。匯出格式 CSV／XLSX，匯出行為會寫入一筆稽核紀錄。</div>'+
   '</div></div>';

  h+='<div class="grid3" style="margin-bottom:16px">'+
   '<div class="stat"><div class="k">總提問數</div><div class="v">'+num(d.q)+'</div><div class="d">'+d.unit+'</div></div>'+
   '<div class="stat"><div class="k">使用人數</div><div class="v">'+num(d.u)+'</div><div class="d">至少成功送出 1 次</div></div>'+
   '<div class="stat"><div class="k">啟用中代理人</div><div class="v">'+d.a+'</div><div class="d">對外提供服務</div></div></div>';

  h+='<div class="card"><div class="card-h"><h3>部門提問次數</h3><span class="sub">'+d.unit+'</span></div><div class="card-b">';
  d.dept.forEach(function(x){
    h+='<div style="display:grid;grid-template-columns:130px 1fr 90px 110px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)">'+
     '<div>'+x.d+'</div><div class="bar"><i style="width:'+(x.q/max*100)+'%"></i></div>'+
     '<div class="num">'+num(x.q)+'</div><div class="num" style="color:var(--muted)">'+num(x.t)+' tk</div></div>';
  });
  h+='</div></div>';
  return h;
}

/* ---------- 回饋管理 ---------- */
function pageFeedback(){
  const pos=FEEDBACK.filter(f=>f.score>=7).length, neg=FEEDBACK.length-pos;
  const rate=Math.round(pos/FEEDBACK.length*100), negRate=100-rate;
  const departments=[...new Set(FEEDBACK.map(f=>f.d))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const sortValue=(f,key)=>key==='time'?Date.parse(f.time):key==='user'?f.u:key==='agent'?f.agent:key==='score'?f.score:key==='content'?f.q:(f.note||'');
  const showTime=value=>new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value));
  const direction=state.feedbackDir==='desc'?-1:1;
  const rows=FEEDBACK.map((f,i)=>({f,i})).filter(({f})=>{
    if(state.feedbackDept&&f.d!==state.feedbackDept)return false;
    if(state.feedbackScore==='positive'&&f.score<7)return false;
    if(state.feedbackScore==='negative'&&f.score>=7)return false;
    return true;
  }).sort((a,b)=>{
    const av=sortValue(a.f,state.feedbackSort),bv=sortValue(b.f,state.feedbackSort);
    const result=typeof av==='number'?av-bv:String(av).localeCompare(String(bv),'zh-Hant');
    return result*direction||a.i-b.i;
  });
  const sortHead=(key,label,width,cls='')=>'<th '+(width?'style="width:'+width+'" ':'')+'class="'+cls+'"><button class="sort-btn '+(state.feedbackSort===key?'active':'')+'" data-feedback-sort="'+key+'">'+label+(state.feedbackSort===key?'<small>'+(state.feedbackDir==='desc'?'高到低':'低到高')+'</small>':'')+'</button></th>';
  let h='<div class="page-head"><h2>回饋管理</h2></div>';
  h+='<div class="grid3" style="margin-bottom:16px">'+
   '<div class="stat"><div class="k">回饋總數</div><div class="v">'+FEEDBACK.length+'</div></div>'+
   '<div class="stat"><div class="k">正向回饋</div><div class="v">'+pos+'</div><div class="d">'+rate+'% · 7–10 分<div class="bar" style="margin-top:7px"><i style="width:'+rate+'%"></i></div></div></div>'+
  '<div class="stat"><div class="k">負向回饋</div><div class="v" style="color:var(--amber)">'+neg+'</div><div class="d">'+negRate+'% · 1–6 分</div></div></div>';
  h+='<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="filters">'+
   '<div class="f"><label>部門</label><select id="fbdept"><option value="">全部部門</option>'+departments.map(d=>'<option value="'+esc(d)+'" '+(state.feedbackDept===d?'selected':'')+'>'+esc(d)+'</option>').join('')+'</select></div>'+
   '<div class="f"><label>評分</label><select id="fbscore"><option value="">全部評分</option><option value="positive" '+(state.feedbackScore==='positive'?'selected':'')+'>正向（7–10 分）</option><option value="negative" '+(state.feedbackScore==='negative'?'selected':'')+'>負向（1–6 分）</option></select></div>'+
  '</div></div></div>';
  h+='<div class="card"><div class="card-h"><h3>回饋列表</h3><span class="sub">'+rows.length+' 筆</span></div><div class="scroll"><table class="tbl"><thead><tr>'+
   sortHead('time','評分時間','180px')+sortHead('user','使用者','130px')+sortHead('agent','代理人','150px')+sortHead('score','分數','150px','num')+sortHead('content','問題與留言')+sortHead('note','備註','330px')+'</tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="6" style="padding:32px;text-align:center;color:var(--muted)">找不到符合條件的回饋。</td></tr>';
  rows.forEach(({f,i})=>{
    const editing=state.editNote===i;
    h+='<tr style="cursor:default"><td><div class="t">'+showTime(f.time)+'</div></td><td><div class="t">'+f.u+'</div><div class="m">'+f.d+'</div></td>'+
     '<td>'+f.agent+'</td><td class="num"><span class="pill '+(f.score>=7?'ok':'bad')+'">'+f.score+'</span></td>'+
     '<td><div class="t">'+esc(f.q)+'</div><div class="m" style="margin-top:3px">'+esc(f.c)+'</div></td>'+
     '<td><div class="note-editor">'+
     (editing?'<input class="fbnote" data-i="'+i+'" value="'+esc(f.note||'')+'" placeholder="輸入備註">':'<div class="note-display '+(f.note?'':'empty')+'">'+esc(f.note||'尚無備註')+'</div>')+
     (editing?'<button class="btn small save-note" data-i="'+i+'">儲存</button>':'<button class="btn ghost small edit-note" data-i="'+i+'">'+(f.note?'修改':'新增')+'</button>')+
     '</div></td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

/* ---------- render ---------- */
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2800);
}
function render(){
  renderNav();
  const R={audit:pageAudit,users:pageUsers,stats:pageStats,feedback:pageFeedback};
  $('#wrap').innerHTML=R[state.page]();
  bind();
}
function bind(){
  const op=$('#fop'),dept=$('#fdept'),kw=$('#fkw');
  if(op)op.onchange=()=>{state.op=op.value;render()};
  if(dept)dept.onchange=()=>{state.auditDept=dept.value;render()};
  if(kw)kw.oninput=()=>{state.kw=kw.value;render();const n=$('#fkw');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  const userkw=$('#userkw'),usersort=$('#usersort');
  if(userkw)userkw.oninput=()=>{state.userKw=userkw.value;render();const n=$('#userkw');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  if(usersort)usersort.onchange=()=>{state.userSort=usersort.value;render()};
  const feedbackDept=$('#fbdept'),feedbackScore=$('#fbscore');
  if(feedbackDept)feedbackDept.onchange=()=>{state.feedbackDept=feedbackDept.value;state.editNote=null;render()};
  if(feedbackScore)feedbackScore.onchange=()=>{state.feedbackScore=feedbackScore.value;state.editNote=null;render()};
  document.querySelectorAll('[data-feedback-sort]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.feedbackSort;
    if(state.feedbackSort===key)state.feedbackDir=state.feedbackDir==='desc'?'asc':'desc';
    else{state.feedbackSort=key;state.feedbackDir='desc'}
    state.editNote=null;render();
  });
  document.querySelectorAll('[data-period]').forEach(function(b){b.onclick=function(){state.period=b.dataset.period;render()}});
  const df=$('#dfrom'),dt=$('#dto');
  if(df)df.onchange=function(){state.from=df.value;render()};
  if(dt)dt.onchange=function(){state.to=dt.value;render()};
  const sx=$('#statexport');
  if(sx)sx.onclick=function(){toast('已建立使用統計匯出（Prototype）。匯出行為會寫入一筆稽核紀錄。')};
  document.querySelectorAll('.rolesel').forEach(s=>s.onchange=()=>toast('角色已變更（Prototype）。成功的特權操作同樣寫入稽核紀錄。'));
  document.querySelectorAll('.edit-note').forEach(b=>b.onclick=()=>{state.editNote=Number(b.dataset.i);render();const n=document.querySelector('.fbnote[data-i="'+b.dataset.i+'"]');if(n)n.focus()});
  document.querySelectorAll('.save-note').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i),n=document.querySelector('.fbnote[data-i="'+i+'"]');FEEDBACK[i].note=n?n.value.trim():'';state.editNote=null;toast('備註已儲存（Prototype）。');render()});
}
render();
</script>
</body>
</html>
